#------------------------------------------------------------------------------
# ARIA - Advanced Reforger Intelligent AI  (settings version 1)
#------------------------------------------------------------------------------
# Edit values and restart the server, or use '#aria reload' / '#aria set <key> <value>' as admin.
general.enabled = true    # Master switch for the whole mod (true/false)
general.preset = REALISTIC    # Baseline applied before this file: CASUAL, REALISTIC, ELITE or CUSTOM
general.logLevel = 2    # 0=errors 1=warnings 2=info 3=debug 4=verbose (0..4)
general.excludedFactions =     # Comma separated faction keys ARIA must not touch, e.g. CIV,FIA
general.maxGroupsPerFrame = 6    # Performance: squads evaluated per frame (1..100)
# 
# Everything below is commented out so the preset decides the value.
# Remove the leading '#' of a line to override that single value.

#------------------------------------------------------------------------------
# Squad / infantry group AI
#------------------------------------------------------------------------------
#squad.enabled = true    # Enable ARIA squad tactics (true/false)
#squad.affectPlayerLedGroups = false    # Also manage AI groups led by a player (true/false)
#squad.thinkInterval = 1    # Seconds between squad decisions (0.25..10)
# Knowledge and communication
#squad.contactMemory = 90    # Seconds an unseen enemy stays in squad memory (10..600)
#squad.shareIntel = true    # Squads radio enemy positions to friendly squads (true/false)
#squad.intelShareRadius = 1200    # Radio range in meters (50..10000)
#squad.intelRadioDelay = 4    # Seconds of radio delay before intel arrives (0..60)
# Tactics
#squad.flanking = true    # Squads try to flank known enemy positions (true/false)
#squad.flankMinDistance = 80    # Do not flank enemies closer than this (20..1000)
#squad.flankMaxDistance = 600    # Do not flank enemies farther than this (50..3000)
#squad.suppressAndHold = true    # Outgunned squads hold position and suppress (true/false)
#squad.withdraw = true    # Broken squads withdraw instead of dying in place (true/false)
#squad.withdrawCasualtyRatio = 0.5    # Losses (fraction) that can trigger withdrawal (0.1..1)
#squad.withdrawForceRatio = 2.5    # Enemy/friendly strength ratio that can trigger withdrawal (1..10)
#squad.withdrawDistance = 250    # How far squads fall back (50..2000)
#squad.engageRange = 800    # Max distance at which a squad treats a contact as a fight (100..3000)
# Cooperation
#squad.reinforcements = true    # Idle squads move to help squads in contact (true/false)
#squad.reinforceRadius = 1000    # Max distance for a squad to answer a call for help (100..5000)
#squad.maxReinforcingGroups = 2    # Squads that may answer one call (0..10)
#squad.combatTimeout = 60    # Seconds without contact before combat is considered over (10..600)
# Assets
#squad.useStaticWeapons = true    # Squads in a fight man free static weapons (MGs, launchers) nearby (true/false)
#squad.staticWeaponRadius = 60    # Search radius for static weapons (10..300)
#squad.useNearbyVehicles = true    # Squads take free friendly vehicles for long moves (true/false)
#squad.vehicleSearchRadius = 150    # Search radius for free vehicles (20..1000)
#squad.minTravelForVehicle = 700    # Only mount up for moves longer than this (100..10000)

#------------------------------------------------------------------------------
# Ground vehicles (cars, trucks, APCs, IFVs, static weapons)
#------------------------------------------------------------------------------
#vehicle.enabled = true    # Enable ARIA ground vehicle handling (true/false)
#vehicle.thinkInterval = 0.5    # Seconds between vehicle decisions (0.1..5)
# Crew
#vehicle.fillTurrets = true    # Passengers move into empty turret seats in combat (true/false)
#vehicle.dismountOnContact = true    # Infantry in transports dismount when contact is near (true/false)
#vehicle.dismountDistance = 400    # Contact distance that triggers a dismount (50..2000)
#vehicle.crewSupportsDismounts = true    # Driver+gunner of armed vehicles stay and give fire support (true/false)
# Driving recovery
#vehicle.stuckRecovery = true    # Detect and recover stuck vehicles (true/false)
#vehicle.stuckTime = 8    # Seconds without progress before a vehicle is stuck (2..60)
#vehicle.stuckSpeed = 0.7    # Speed (m/s) under which a driving vehicle counts as not moving (0.1..5)
#vehicle.flipRecovery = true    # Put flipped vehicles back on their wheels (true/false)
#vehicle.flipTime = 6    # Seconds upside down before flip recovery (1..60)
# Damage
#vehicle.bailOutWhenCrippled = true    # Crew bails out of crippled vehicles (true/false)
#vehicle.bailOutHealth = 0.25    # Hull health fraction that counts as crippled (0..1)
# Convoys
#vehicle.convoyMaxSpeedKmh = 60    # Speed cap for multi-vehicle groups (10..150)

#------------------------------------------------------------------------------
# Helicopters (AI pilots - new feature)
#------------------------------------------------------------------------------
#heli.enabled = true    # AI pilots fly helicopters (true/false)
# Flight envelope
#heli.cruiseSpeedKmh = 170    # Transit speed (40..320)
#heli.combatSpeedKmh = 110    # Speed near the enemy (30..320)
#heli.cruiseAltitude = 120    # Transit altitude above ground (m) (20..1500)
#heli.combatAltitude = 60    # Altitude above ground near the enemy (m) (15..1000)
#heli.napOfEarthAltitude = 25    # Low-level altitude used when evading (m) (8..200)
#heli.minAltitude = 15    # except landing (m) (5..200)
#heli.maxTiltDeg = 28    # Max pitch/bank angle (5..60)
#heli.maxClimbRate = 9    # Max climb rate (m/s) (1..30)
#heli.maxDescentRate = 7    # Max descent rate (m/s) (1..30)
#heli.landingDescentRate = 2    # Final touchdown descent rate (m/s) (0.3..6)
#heli.maxYawRateDeg = 45    # Max turn rate (deg/s) (5..180)
#heli.maxAccel = 4.5    # Max horizontal acceleration (m/s2) (1..15)
#heli.terrainLookahead = 6    # Seconds of terrain look-ahead for terrain following (1..20)
#heli.obstacleClearance = 25    # Clearance kept above trees/buildings (m) (5..100)
# Landing zones
#heli.lzSearchRadius = 150    # Search radius for a safe landing spot (20..1000)
#heli.lzMaxSlopeDeg = 12    # Max ground slope for landing (2..30)
#heli.lzClearRadius = 12    # Obstacle-free radius required for landing (rotor clearance) (5..40)
#heli.unloadTimeout = 45    # Max seconds on the ground while unloading (5..300)
#heli.boardTimeout = 120    # Max seconds waiting for passengers at pickup (10..600)
# Combat
#heli.casOrbitRadius = 450    # Orbit radius around the target for door gunners (100..3000)
#heli.casOrbitAltitude = 140    # Orbit altitude above ground (30..1500)
#heli.casOrbitSpeedKmh = 90    # Orbit speed (30..250)
#heli.casStationTime = 240    # Seconds on station before returning (30..1800)
#heli.evadeWhenHit = true    # Break off low and fast when taking hits (true/false)
#heli.rtbWhenDamaged = true    # Return to base when badly damaged (true/false)
#heli.rtbHealth = 0.45    # Hull health fraction that triggers RTB (0..1)
#heli.copilotTakeover = true    # Co-pilot takes the controls if the pilot dies (true/false)
# Automatic support (air mobility)
#heli.autoAirlift = true    # Idle transport helicopters fly infantry squads to far waypoints (true/false)
#heli.airliftMinDistance = 2000    # Min move distance to request an airlift (300..20000)
#heli.airliftSearchRadius = 4000    # Max distance from the helicopter to the squad (500..30000)
#heli.airliftLZOffset = 350    # Land this far short of the objective (0..2000)
#heli.autoCAS = true    # Armed helicopters answer calls for close air support (true/false)
#heli.casRequestRadius = 5000    # Max distance for CAS requests (500..30000)
# Flight controller tuning (advanced - change carefully)
#heli.ctl.flightModel = 0    # pure physics) (0..1)
#heli.ctl.velocityGain = 0.9    # Velocity tracking gain (0.05..5)
#heli.ctl.velocityIntegral = 0.25    # Velocity integral gain (wind / lift compensation) (0..3)
#heli.ctl.altitudeGain = 0.6    # Altitude error -> climb rate gain (0.05..5)
#heli.ctl.attitudeGain = 3.5    # Attitude error -> angular rate gain (0.2..20)
#heli.ctl.yawGain = 1.6    # Heading error -> yaw rate gain (0.1..10)
#heli.ctl.angularResponse = 6    # How fast the airframe follows commanded rates (0.5..30)
#heli.ctl.horizontalAssist = 0.25    # Direct horizontal force assist (0 = pure tilt physics) (0..1)
#heli.ctl.maxThrustG = 2    # Max rotor thrust in g (1.1..4)
#heli.ctl.spoolUpTime = 12    # Max seconds to wait for rotor spool-up before takeoff (0..60)

#------------------------------------------------------------------------------
# Skill profile:  default
#------------------------------------------------------------------------------
#skill.default.skill = 0.6    # General combat skill (0 recruit .. 1 elite) (0..1)
#skill.default.perception = 1    # Spotting multiplier (0.1..3)
#skill.default.reactionTime = 0.6    # Seconds before squad reacts to new contact (0..10)
#skill.default.courage = 0.6    # Higher = holds ground longer before withdrawing (0..1)
#skill.default.aggression = 0.5    # Higher = assaults and flanks more often (0..1)
#skill.default.teamwork = 0.8    # Chance to share intel and answer calls for help (0..1)
# 
# Per-faction overrides: copy the 'skill.default' block and replace 'default' with a faction key,
# for example 'skill.USSR.skill = 0.8'. Unlisted values inherit from skill.default.
